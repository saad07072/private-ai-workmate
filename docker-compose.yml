services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file:
      - ./backend/.env
    environment:
      WORKMATE_DATA_DIR: /app/data
      WORKMATE_DATABASE_PATH: /app/data/workmate.db
      WORKMATE_QDRANT_PATH: /app/data/qdrant
      WORKMATE_DOCUMENTS_PATH: /app/data/documents
      WORKMATE_AUDIT_FILE: /app/data/tool_audit.jsonl
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost}
      WORKMATE_COOKIE_SECURE: ${WORKMATE_COOKIE_SECURE:-false}
    command: ["sh", "-c", "export NEBIUS_API_KEY=\"$${nebius_api_key}\"; exec uvicorn app.main:app --host 0.0.0.0 --port 8000"]
    volumes:
      - workmate_data:/app/data
      - qdrant_data:/app/data/qdrant
    expose:
      - "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    ports:
      - "${FRONTEND_PORT:-80}:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  workmate_data:
  qdrant_data:
